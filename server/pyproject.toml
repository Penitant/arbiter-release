[project]
name = "arbiter-server"
version = "0.0.1"
description = "Arbiter Server — local-first model router proxy for OpenCode (plumbing milestone)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    # CPU-only torch (see [tool.uv.sources]); the GPU is left to Ollama.
    "torch>=2.4",
    # <5: codesage's remote code imports Conv1D, removed from modeling_utils in 5.x.
    "transformers>=4.44,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Only needed to rebuild the training set / retrain from scratch, not at serve time.
train = [
    "datasets>=2.20",
    "pandas>=2.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
