name: Release

# Build + publish release artifacts on a version tag only. Pushes to branches never trigger this.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="v$(node -p "require('./notary/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $TAG != package version $PKG" >&2
            exit 1
          fi

      - name: Build release + publish
        run: bash scripts/release.sh "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
